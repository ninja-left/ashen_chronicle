name: Temporary Rust Format Export

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
      - name: Format
        run: cargo fmt --all
      - name: Commit formatted sources
        shell: bash
        run: |
          if git diff --quiet -- Cargo.toml Cargo.lock src/game.rs src/game/actions.rs src/game/combat.rs; then
            echo "Rust sources are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock src/game.rs src/game/actions.rs src/game/combat.rs
          git commit -m "style: format v0.24.0 gameplay architecture"
          git push
