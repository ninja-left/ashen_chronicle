name: Apply v0.23.0 game screen refactor

on:
  push:
    branches:
      - refactor/game-screens-v0.23.0

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract game screens
        shell: python
        run: |
          from pathlib import Path
          import re

          game_path = Path("src/game.rs")
          text = game_path.read_text(encoding="utf-8")

          def remove_region(source: str, start: str, end: str) -> str:
              start_index = source.index(start)
              end_index = source.index(end, start_index)
              return source[:start_index] + source[end_index:]

          text = remove_region(text, "fn start_screen(", "fn bootstrap_campaign_content")
          text = remove_region(text, "fn create_from_prompts(", "fn quit_screen()")
          text = remove_region(text, "fn quit_screen()", "fn build_main_menu")
          text = remove_region(text, "fn death_screen(", "fn death_legacy_screen")
          text = remove_region(text, "fn death_legacy_screen(", "") if False else text

          death_start = text.index("fn death_legacy_screen(")
          text = text[:death_start].rstrip() + "\n"

          text = text.replace("use crate::model::{\n    create_inherited_state, create_new_state, Condition, Corpse, EntityId, Faction, GameState,\n    Item, Npc, Quest, WorldMode,\n};", "use crate::model::{\n    Condition, Corpse, EntityId, Faction, GameState, Item, Npc, Quest,\n};")
          text = text.replace("use crate::persistence::{\n    character_save_path, find_save_files, legacy_save_path, load_game, save_game,\n};", "use crate::persistence::{character_save_path, save_game};")
          text = text.replace("    set_dashboard, set_location_scene, set_menu_screen, set_player_health, Dashboard,", "    set_dashboard, set_location_scene, set_player_health, Dashboard,")
          text = text.replace("use std::time::{SystemTime, UNIX_EPOCH};", "use std::time::{SystemTime, UNIX_EPOCH};")

          if "mod screens;" not in text:
              text = "mod screens;\n\n" + text

          text = text.replace("start_screen()?", "screens::start_screen()?")
          text = text.replace("death_screen(state)?", "screens::death_screen(state)?")
          text = text.replace("quit_screen()?", "screens::quit_screen()?")
          text = text.replace("fn validate_loaded_state(state: &GameState)", "pub(crate) fn validate_loaded_state(state: &GameState)")

          game_path.write_text(text, encoding="utf-8")

          cargo = Path("Cargo.toml")
          cargo_text = cargo.read_text(encoding="utf-8")
          cargo_text = cargo_text.replace('version = "0.22.3"', 'version = "0.23.0"', 1)
          cargo.write_text(cargo_text, encoding="utf-8")

          roadmap = Path("ROADMAP.md")
          roadmap_text = roadmap.read_text(encoding="utf-8")
          if "## v0.23.0 Game screen architecture refactor" not in roadmap_text:
              roadmap_text += """

## v0.23.0 Game screen architecture refactor

Completed:
- extracted the start screen, save-selection screen, character creation prompts, quit screen, and death screen into `src/game/screens.rs`
- kept the game loop and gameplay actions in `src/game.rs`
- preserved the existing start, load, quit, death, and inheritance behavior without changing gameplay rules
- exposed loaded-state validation only where the screen module needs it
- bumped the project version to v0.23.0
"""
          roadmap.write_text(roadmap_text, encoding="utf-8")

      - name: Remove temporary workflow
        run: rm .github/workflows/refactor-game-screens.yml

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/game.rs src/game/screens.rs Cargo.toml ROADMAP.md .github/workflows/refactor-game-screens.yml
          git commit -m "refactor: extract game screens" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
