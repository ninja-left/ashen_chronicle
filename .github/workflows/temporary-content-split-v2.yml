name: Temporary Content Architecture Split v2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  split:
    if: github.event.head_commit.message != 'refactor: split content architecture'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Split content module and update version/docs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src/content

          {
            echo 'use serde::{Deserialize, Serialize};'
            echo 'use std::collections::HashSet;'
            echo
            sed -n '14,205p' src/content.rs
            echo
            sed -n '207,417p' src/content.rs
            sed -n '494,529p' src/content.rs
            echo
            echo 'fn default_true() -> bool {'
            echo '    true'
            echo '}'
            echo
            echo 'fn default_mod_content_file() -> String {'
            echo '    "content.json".to_string()'
            echo '}'
          } > src/content/definitions.rs

          {
            echo 'use crate::content::definitions::CampaignContent;'
            echo 'use crate::model::{Location, Region, World};'
            echo
            echo 'impl CampaignContent {'
            sed -n '418,493p' src/content.rs
            echo '}'
          } > src/content/seeding.rs

          {
            echo 'use super::definitions::*;'
            echo 'use crate::ui;'
            echo 'use std::collections::HashSet;'
            echo 'use std::env;'
            echo 'use std::fs;'
            echo 'use std::io;'
            echo 'use std::path::{Path, PathBuf};'
            echo
            echo 'const CONTENT_FILE_NAME: &str = "data/base_content.json";'
            echo 'const MODS_DIR_NAME: &str = "data/mods";'
            echo
            echo '#[derive(Debug, Clone)]'
            echo 'struct DiscoveredMod {'
            echo '    manifest: ModManifest,'
            echo '    manifest_path: PathBuf,'
            echo '}'
            echo
            echo 'impl ContentLoadReport {'
            echo '    fn with_content(content: CampaignContent) -> Self {'
            echo '        Self {'
            echo '            content,'
            echo '            loaded_mods: Vec::new(),'
            echo '            warnings: Vec::new(),'
            echo '        }'
            echo '    }'
            echo '}'
            echo
            sed -n '552,955p' src/content.rs
            sed -n '956,1133p' src/content.rs
          } > src/content/loader.rs

          cat > src/content.rs <<'EOF'
          pub mod definitions;
          pub mod loader;
          pub mod seeding;

          pub use definitions::*;
          pub use loader::{load_campaign_content, load_campaign_content_report, ContentLoadReport};
          EOF

          sed -i '0,/version = "0.24.0"/s//version = "0.25.0"/' Cargo.toml
          sed -i '0,/name = "ashen_chronicle"/{N;s/name = "ashen_chronicle"\nversion = "0.23.0"/name = "ashen_chronicle"\nversion = "0.25.0"/;}' Cargo.lock

          python3 - <<'PY'
          from pathlib import Path
          path = Path('ROADMAP.md')
          text = path.read_text()
          old = 'Planned follow-up:\n- v0.25.0: Split content loading/definitions/seeding out of `content.rs`.\n'
          new = '''## v0.25.0 Content Architecture

- split the monolithic `content.rs` into `content/definitions.rs`, `content/loader.rs`, and `content/seeding.rs`
- kept `content.rs` as a compatibility-facing module facade and preserved the existing public content-loading API
- moved campaign data definitions and content validation into the definitions module
- moved world seeding and content-to-world translation into the seeding module
- moved base/mod loading, merging, event filtering, path discovery, and related tests into the loader module
- preserved campaign content formats, mod behavior, event validation, and save compatibility
- bumped the project version to v0.25.0

Planned follow-up:
- v0.26.0: Continue architectural cleanup only where another clear responsibility boundary improves maintainability.
'''
          if old not in text:
              raise SystemExit('expected roadmap tail not found')
          path.write_text(text.replace(old, new, 1))
          PY

          rm -f .github/workflows/temporary-content-export.yml
          rm -f .github/workflows/temporary-content-split.yml
          rm -f .github/workflows/temporary-content-split-v2.yml

      - name: Format
        run: cargo fmt --all

      - name: Commit split architecture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock ROADMAP.md src/content.rs src/content/definitions.rs src/content/loader.rs src/content/seeding.rs
          git add -u .github/workflows/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "refactor: split content architecture"
          git push
