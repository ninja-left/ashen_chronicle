name: CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Run validation and tests
        shell: bash
        run: |
          set +e

          : > test.log

          echo '=== cargo fmt --check ===' >> test.log
          cargo fmt --all -- --check >> test.log 2>&1
          fmt_status=$?

          echo >> test.log
          echo '=== cargo clippy ===' >> test.log
          cargo clippy --all-targets --all-features -- -D warnings >> test.log 2>&1
          clippy_status=$?

          echo >> test.log
          echo '=== cargo test --release --no-fail-fast ===' >> test.log
          cargo test --release --no-fail-fast >> test.log 2>&1
          test_status=$?

          echo >> test.log
          echo "fmt_status=$fmt_status" >> test.log
          echo "clippy_status=$clippy_status" >> test.log
          echo "test_status=$test_status" >> test.log

          if [ "$fmt_status" -ne 0 ] || [ "$clippy_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then
            exit 1
          fi

      - name: Archive test log
        if: always()
        shell: bash
        run: |
          set +e
          tar caf test-log.tar.xz test.log

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: test-log-${{ github.run_id }}.tar.xz
          path: test-log.tar.xz
          if-no-files-found: error
          retention-days: 7
          archive: false

  release:
    name: Build and Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Verify tag points to main
        shell: bash
        run: |
          if ! git branch -r --contains "$GITHUB_SHA" | grep -qE 'origin/main$'; then
            echo "Tag $GITHUB_REF_NAME does not point to a commit contained in main."
            exit 1
          fi

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1.17.0
        with:
          toolchain: stable
          cache: true

      - name: Validate release version
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "Release tags must use vMAJOR.MINOR.PATCH; got $GITHUB_REF_NAME"
              exit 1
              ;;
          esac

          package_version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d'\"' -f2)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [ "$package_version" != "$tag_version" ]; then
            echo "Cargo.toml version ($package_version) does not match tag ($tag_version)."
            exit 1
          fi

      - name: Build release binary
        shell: bash
        run: |
          set +e
          : > build.log

          echo '=== cargo build --release ===' >> build.log
          cargo build --release >> build.log 2>&1
          build_status=$?
          echo "build_status=$build_status" >> build.log

          if [ "$build_status" -ne 0 ]; then
            exit "$build_status"
          fi

      - name: Package source archive
        shell: bash
        run: |
          archive="ashen_chronicle-${GITHUB_REF_NAME}.tar.xz"
          prefix="ashen_chronicle-${GITHUB_REF_NAME}/"

          if ! git archive --format=tar --prefix="$prefix" "$GITHUB_SHA" | xz -9 -T0 > "$archive" 2>> build.log; then
            echo 'Source archive creation failed.' >> build.log
            exit 1
          fi

          echo "archive=$archive" >> build.log

      - name: Archive build log
        if: always()
        shell: bash
        run: |
          set +e
          tar caf build-log.tar.xz build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-log-${{ github.run_id }}.tar.xz
          path: build-log.tar.xz
          if-no-files-found: error
          retention-days: 7
          archive: false

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ashen_chronicle-${{ github.ref_name }}.tar.xz
